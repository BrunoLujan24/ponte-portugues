<!doctype html>
<html lang="es">

<title>Ponte Português</title>
<meta name="description" content="Portugués de Brasil de cero a B2 para hispanohablantes: repetición espaciada, escucha, shadowing y sesiones de 15 a 20 minutos.">
<meta name="theme-color" content="#0A6870" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ponte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">
<style>

:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --statusbar: #0A6870; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --statusbar: #0B1514; } }
:root[data-theme="dark"] { --statusbar: #0B1514; }
body { margin: 0; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }
@media (display-mode: standalone) { body::before { background: var(--statusbar); } }

:root {
  /* Layout: one thumb-reach column (max 34rem). Tab bar fixed at the bottom; practice uses a sticky top bar and a bottom feedback sheet. Portuguese is always set in the serif, Spanish and UI in the sans. */
  --bg: #F1F5F4;
  --surface: #FFFFFF;
  --surface-2: #E6EDEB;
  --ink: #10211F;
  --muted: #536663;
  --line: #D2DCD9;
  --accent: #0A6870;
  --accent-ink: #FFFFFF;
  --accent-soft: #D3EAEA;
  --sun: #B9700D;
  --sun-soft: #F8E7CE;
  --ok: #1B7646;
  --ok-soft: #DCEFE3;
  --bad: #AE3828;
  --bad-soft: #F6E0DA;
  --div: #6B4FA8;
  --div-soft: #ECE5F7;
  --wave: #10211F;
  --wave-bg: #FFFFFF;
  --shadow: 0 1px 2px rgba(16, 33, 31, .06), 0 8px 22px rgba(16, 33, 31, .07);
  --sheet-shadow: 0 -8px 30px rgba(16, 33, 31, .14);
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-pt: "Newsreader", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 16px;
  --r-s: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1514; --surface: #12201F; --surface-2: #1A2B29; --ink: #E4EFEC; --muted: #93A8A4; --line: #263A38;
    --accent: #52BAC0; --accent-ink: #04201F; --accent-soft: #143A3B;
    --sun: #F0AE4C; --sun-soft: #3A2C14; --ok: #56C487; --ok-soft: #143323; --bad: #F07D66; --bad-soft: #3D1D17;
    --div: #B49BE8; --div-soft: #2A2240; --wave: #E4EFEC; --wave-bg: #0B1514;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .25); --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1514; --surface: #12201F; --surface-2: #1A2B29; --ink: #E4EFEC; --muted: #93A8A4; --line: #263A38;
  --accent: #52BAC0; --accent-ink: #04201F; --accent-soft: #143A3B;
  --sun: #F0AE4C; --sun-soft: #3A2C14; --ok: #56C487; --ok-soft: #143323; --bad: #F07D66; --bad-soft: #3D1D17;
  --div: #B49BE8; --div-soft: #2A2240; --wave: #E4EFEC; --wave-bg: #0B1514;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .25); --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.fill { fill: currentColor; stroke: none; }
.pt { font-family: var(--f-pt); font-optical-sizing: auto; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.8125rem; }
.center { text-align: center; justify-content: center; }
.eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.lede { color: var(--muted); max-width: 62ch; margin: 4px 0 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.row.three > * { flex: 1 1 0; min-width: 0; }
.grow { flex: 1 1 auto; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

/* ---------- shell ---------- */
.shell { min-height: 100%; }
.main, .solo {
  max-width: 34rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
.solo { padding-block: 0 calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.phead { display: flex; align-items: center; gap: 10px; padding-block: 18px 12px; }
.phead h1 { font-size: 1.375rem; font-weight: 800; flex: 1; min-width: 0; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-in { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 0.75rem; font-weight: 600; min-height: 58px; }
.tab.on { color: var(--accent); }
.tab.on svg { stroke-width: 2.3; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; color: var(--ink); flex: none; }
.icon-btn.small { width: 36px; height: 36px; }
.icon-btn.small svg { width: 16px; height: 16px; }
.icon-btn.tr { font-family: var(--f-mono); font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.sync { font-size: 0.6875rem; font-weight: 600; color: var(--muted); padding: 4px 8px; border-radius: 99px; background: var(--surface-2); white-space: nowrap; }
.sync.s-saving { color: var(--accent); }
.sync.s-error, .sync.s-local { color: var(--sun); background: var(--sun-soft); }
.sync.s-device { color: var(--muted); background: var(--surface-2); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px;
  border-radius: var(--r-s); border: 1.5px solid var(--line); background: var(--surface); font-weight: 650; font-size: 1rem; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.danger.ghosty { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 0.875rem; }
.btn.block { width: 100%; }
.btn.xl { width: 100%; min-height: 64px; flex-direction: column; gap: 2px; font-size: 1.0625rem; border-radius: var(--r); }
.btn.xl small { font-weight: 500; font-size: 0.8125rem; opacity: 0.85; }
.btn.big { flex: 1; min-height: 60px; font-size: 1.125rem; }
.btn.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.link { background: none; border: 0; padding: 8px 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.link.inline { padding: 0; display: inline; }
.link.center { display: block; margin: 0 auto; }
.confirm { background: var(--bad-soft); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: block; width: 100%; text-align: left; margin-bottom: 14px; }
.stack > .panel { margin-bottom: 0; }
button.panel { cursor: pointer; }
.panel.notice { background: var(--surface-2); border-color: transparent; display: flex; flex-direction: column; gap: 10px; }
.panel.bad { border-color: var(--bad); background: var(--bad-soft); }
.panel.okp { border-color: var(--ok); display: flex; flex-direction: column; gap: 10px; }
.unit-card, .cta { display: flex; flex-direction: column; gap: 6px; }
.unit-title, .cta-title { font-family: var(--f-pt); font-size: 1.375rem; font-weight: 600; line-height: 1.2; }
.cta { border-color: var(--accent); }
.cta.strong { background: var(--accent-soft); }
.bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 6px 0 2px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; min-width: 4px; }
.sec { font-size: 1.0625rem; font-weight: 800; margin: 22px 0 10px; }
.sec0 { font-size: 1rem; font-weight: 800; margin-bottom: 12px; }
.errs { margin: 8px 0 0; padding-left: 18px; font-size: 0.8125rem; display: flex; flex-direction: column; gap: 4px; word-break: break-word; }
.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

/* ---------- home ---------- */
.hero { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.waves { display: block; }
.hero-in { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; }
.logo { font-family: var(--f-pt); font-style: italic; font-weight: 600; font-size: 1.5rem; letter-spacing: -0.01em; }
.logo-sub { font-size: 0.75rem; color: var(--muted); flex: 1; }
.greet { font-size: 2.75rem; font-weight: 500; line-height: 1.05; margin-top: 14px; letter-spacing: -0.015em; }
.date { color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.date > span:first-child::first-letter { text-transform: uppercase; }
.date > span:first-child { display: inline-block; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.tiles.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 30rem) { .tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; position: relative; min-width: 0; }
.tile-num { font-size: 1.75rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile-num small { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
.tile-lbl { font-size: 0.75rem; color: var(--muted); line-height: 1.25; }
.tile-lbl small { font-size: 0.6875rem; }
.tile-ic { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.tile-ic.sun { background: var(--sun-soft); color: var(--sun); }
.tile-ic svg { width: 18px; height: 18px; }
.ring { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring-bg { stroke: var(--surface-2); }
.ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.levels { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.lv { display: grid; grid-template-columns: 2.2rem 1fr 3rem; align-items: center; gap: 10px; }
.lv-name { font-weight: 800; font-size: 0.875rem; }
.lv-bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.lv-bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.lv-pct { font-size: 0.75rem; text-align: right; color: var(--muted); }
.lv.locked { opacity: 0.45; }

/* ---------- map ---------- */
.lvsec { margin-bottom: 24px; }
.lvhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px; margin-bottom: 10px; }
.lvhead h2 { font-size: 1.25rem; font-weight: 800; }
.lvhead h2 .muted { font-weight: 500; font-size: 1rem; }
.ulist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.urow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; min-height: 64px; }
.ulist > :last-child { border-bottom: 0; }
.un { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 0.8125rem; font-weight: 600; flex: none; }
.ut { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ut strong { font-weight: 700; }
.ut small { color: var(--muted); font-size: 0.75rem; line-height: 1.35; }
.urow.st-pend .ut, .urow.st-lock .ut { opacity: 0.6; }
.urow.st-done .un { background: var(--ok-soft); color: var(--ok); }
.urow.st-go .un, .urow.st-eval .un, .urow.st-new .un { background: var(--accent-soft); color: var(--accent); }
.urow.exam { background: var(--surface-2); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.6875rem; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; letter-spacing: 0.01em; text-transform: none; }
.chip svg { width: 12px; height: 12px; }
.c-done { background: var(--ok-soft); color: var(--ok); }
.c-go, .c-new, .c-eval { background: var(--accent-soft); color: var(--accent); }
.c-false { background: var(--bad-soft); color: var(--bad); }
.c-cog { background: var(--ok-soft); color: var(--ok); }
.c-div { background: var(--div-soft); color: var(--div); }
.c-tag { background: var(--sun-soft); color: var(--sun); }
.utitle { font-family: var(--f-pt); font-size: 1.875rem; font-weight: 600; }
.ustats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.ustats div { display: flex; flex-direction: column; }
.ustats .big { font-size: 1.5rem; font-weight: 600; }
.ustats small { color: var(--muted); font-size: 0.75rem; }
.goals { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.9375rem; }
.det summary { cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.det .prose { margin-top: 10px; }
.vlist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 14px; }
.vrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.vrow:last-child { border-bottom: 0; }
.vrow .pt { font-size: 1.0625rem; flex: 1 1 8rem; min-width: 0; }
.vrow .muted { flex: 1 1 8rem; min-width: 0; font-size: 0.875rem; }

/* ---------- prose & tables ---------- */
.prose { max-width: 62ch; display: flex; flex-direction: column; gap: 10px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.prose em.pt { font-style: italic; font-size: 1.06em; }
.tbl-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-s); }
.gtbl { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
.gtbl th { text-align: left; font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; background: var(--surface-2); }
.gtbl td { padding: 9px 12px; border-top: 1px solid var(--line); }
.gtbl td.pt { font-size: 1.0625rem; }

/* ---------- stats ---------- */
.bars { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 150px; align-items: end; margin: 6px 0 12px; padding-bottom: 22px; }
.goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--sun); height: 0; pointer-events: none; }
.barcol { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.bv { font-size: 0.6875rem; color: var(--muted); margin-bottom: 2px; }
.b { width: 100%; max-width: 32px; background: var(--accent-soft); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.b.hit { background: var(--accent); }
.bl { position: absolute; bottom: -20px; font-size: 0.6875rem; color: var(--muted); text-transform: capitalize; }
.accl { display: flex; flex-direction: column; gap: 10px; }
.accrow { display: grid; grid-template-columns: minmax(0, 1fr) 5rem 4.5rem; gap: 10px; align-items: center; font-size: 0.875rem; }
.accbar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.accbar i { display: block; height: 100%; border-radius: inherit; }
.accbar i.hi { background: var(--ok); } .accbar i.mid { background: var(--sun); } .accbar i.lo { background: var(--bad); }
.accrow .mono { text-align: right; color: var(--muted); }
.fc, .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 120px; align-items: end; padding-bottom: 22px; }
.wk { grid-template-columns: repeat(8, 1fr); }
.fccol, .wkcol { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; position: relative; }
.fcb, .wkb { width: 100%; max-width: 28px; background: var(--accent); border-radius: 5px 5px 2px 2px; min-height: 2px; opacity: 0.85; }
.wkb { background: var(--sun); }

/* ---------- more ---------- */
.mlist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mrow { display: flex; align-items: center; gap: 14px; padding: 14px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; min-height: 68px; }
.mrow:last-child { border-bottom: 0; }
.mic { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.mt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mt small { color: var(--muted); font-size: 0.8125rem; }
.mrow > svg:last-child { color: var(--muted); width: 18px; height: 18px; }
.lbl { display: block; font-size: 0.8125rem; font-weight: 700; margin-bottom: 6px; }
.ta, .input, select.sel {
  width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: var(--r-s); padding: 12px 14px; font-size: 1rem; margin-bottom: 10px;
}
.ta.mono { font-size: 0.8125rem; line-height: 1.45; }
.ta:focus, .input:focus, select.sel:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.spec { white-space: pre-wrap; word-break: break-word; font-family: var(--f-mono); font-size: 0.75rem; line-height: 1.5; background: var(--bg); border-radius: var(--r-s); padding: 12px; margin: 10px 0 0; max-height: 360px; overflow: auto; }
.set { display: flex; gap: 14px; align-items: center; justify-content: space-between; }
.set.col { flex-direction: column; align-items: stretch; }
.set > div:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.set small { color: var(--muted); font-size: 0.8125rem; }

  grammar: [
    {
      id: 'a1-u1-g1', title: 'Los sonidos que cambian', divergent: true,
      body: 'El portugués de Brasil se escribe parecido al español, pero varios sonidos cambian. Estos son los que más vas a practicar:\n- **Vocales nasales**: *ão, ãe, õe, im, um, em*. El aire sale también por la nariz y no se pronuncia la «n» o la «m».\n- **E y o finales átonas** suenan **i** y **u**: *noite* = «nóitʃi», *obrigado* = «obrigádu».\n- **T y d antes de i** (o de una e que suena i) suenan **chi** y **dʒi**: *tia* = «chía», *cidade* = «sidádʒi».\n- **R inicial y rr** suenan como una **j suave**: *rua*, *carro*.\n- **Lh** se parece a «li» y **nh** es la **ñ**: *filho*, *vinho*.\n- **S entre vocales** suena **z**: *casa* = «káza».\n- **É/ó abiertas y ê/ô cerradas** distinguen palabras: *avó* (abuela) y *avô* (abuelo).',
      table: [['noite', '«nói-chi»'], ['cidade', '«si-dá-dʒi»'], ['pão', '«pau» nasal'], ['vinho', '«ví-ño»'], ['casa', '«ká-za»']],
      check: { q: '¿Cómo se pronuncia «noite»?', options: ['nói-te', 'nói-chi', 'nói-ti'], answer: 1 }
    },
    {
      id: 'a1-u1-g2', title: 'Tú, usted, «você» y «a gente»', after: 'a1-u1-v021', divergent: true,
      body: 'En casi todo Brasil **você** cubre «tú» y «usted», y lleva el verbo en 3.ª persona: *você é* (como «usted es»).\n- Para mostrar respeto se usa **o senhor / a senhora**.\n- **Tu** existe en algunas regiones, a menudo también con verbo en 3.ª persona.\n- **A gente** es la forma normal de decir «nosotros» al hablar, y lleva el verbo como «ele»: *a gente é*. **Nós** es más formal o escrito.\n- No existe «vosotros»: **vocês** = ustedes.',
      table: [['você é', 'tú eres / usted es'], ['o senhor / a senhora', 'usted (respeto)'], ['a gente é', 'nosotros somos (hablado)'], ['nós somos', 'nosotros somos'], ['vocês são', 'ustedes son']],
      check: { q: '¿Cuál significa «nosotros» en el habla cotidiana?', options: ['a gente', 'as pessoas', 'vocês'], answer: 0 }
    },
    {
      id: 'a1-u1-g3', title: 'Saludos según la hora y «obrigado/obrigada»', after: 'a1-u1-v011', divergent: true,
      body: '- **Bom dia**: por la mañana. **Boa tarde**: de mediodía hasta que oscurece. **Boa noite**: de noche, al llegar y al irse.\n- *Bom* acompaña a *dia* (masculino) y *boa* a *tarde* y *noite* (femeninos), como en español.\n- **Gracias concuerda con quien habla**: un hombre dice *obrigado* y una mujer *obrigada*. En español «gracias» no cambia.',
      table: [['bom dia', 'buenos días'], ['boa tarde', 'buenas tardes'], ['boa noite', 'buenas noches'], ['obrigado (él) / obrigada (ella)', 'gracias']],
      check: { q: 'Un hombre da las gracias. ¿Qué dice?', options: ['Obrigado', 'Obrigada', 'Obrigados'], answer: 0 }
    },
    {
      id: 'a1-u1-g4', title: 'Artículos: o, a, um, uma', after: 'a1-u1-v041', divergent: true,
      body: 'Los artículos son más cortos que en español:\n- **o / a** = el / la; **os / as** = los / las.\n- **um / uma** = un / una.\n- La «o» del artículo suena «u»: *o café* = «u kafé».\n- Ojo con **a água**: en español decimos «el agua», pero en portugués es *a água*, *uma água*.\n- Con nombres de personas es común el artículo: *a Ana*, *o Lucas*.',
      table: [['o café / a casa', 'el café / la casa'], ['os amigos / as amigas', 'los amigos / las amigas'], ['um pão / uma água', 'un pan / un agua'], ['a água', 'el agua']],
      check: { q: '¿Cómo se dice «el agua»?', options: ['o água', 'a água', 'la água'], answer: 1 }
    }

/* ===================== NÚCLEO (sin DOM) ===================== */
const DAY_MS = 86400000;
function dayIndex(ts) { const d = new Date(ts - 4 * 3600000); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS); }
function dayKey(di) { return new Date(di * DAY_MS).toISOString().slice(0, 10); }
function todayIdx() { return dayIndex(Date.now()); }
function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function shuffle(a, rng) { rng = rng || Math.random; a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function sample(a, n, rng) { return shuffle(a, rng).slice(0, n); }
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* ---------- Texto ---------- */
function norm(s) {
  return String(s == null ? '' : s).normalize('NFC').toLowerCase()
    .replace(/[‘’ʼ]/g, "'").replace(/[–—…]/g, ' ')
    .replace(/[¿?¡!.,;:"“”«»()\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
}
function fold(s) { return norm(s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = new Array(b.length + 1); for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}

/* ---------- Temario ---------- */
function unitStatus(id, sa) {
  const c = cu(id), u = C.units[id];
  if (!u) return { key: 'pend', label: 'Pendiente' };
  if (!levelUnlocked(c.level, ST)) return { key: 'lock', label: 'Bloqueada' };
  const p = unitProgress(u, sa[id], ST.units[id]);
  if (p.passed) return { key: 'done', label: 'Completada' };
  if (p.allIntro) return { key: 'eval', label: 'Mini evaluación' };
  if (p.intro > 0) return { key: 'go', label: Math.round(p.intro / p.total * 100) + ' %' };
  return { key: 'new', label: 'Disponible' };
}
function vMap() {
  const sa = srsAll(), prog = overallProgress(ST, C, sa);
  const sections = LEVELS.map(L => {
    const unlocked = levelUnlocked(L, ST), ex = ST.levels[L] || {};
    const rows = CURRICULUM.filter(c => c.level === L).map(c => {
      const s = unitStatus(c.id, sa), u = C.units[c.id];
      return `<button class="urow st-${s.key}" data-a="unit" data-id="${c.id}"><span class="un mono">${c.n}</span><span class="ut"><strong>${esc(c.title)}</strong><small>${esc(c.desc)}</small></span><span class="chip c-${s.key}">${s.key === 'lock' ? I.lock : ''}${s.label}</span></button>`;
    }).join('');
    const ready = examReady(L, ST, C, sa);
    const exRow = `<div class="urow exam ${ex.passedAt ? 'st-done' : ''}"><span class="un mono">✦</span><span class="ut"><strong>Examen ${L}</strong><small>${ex.passedAt ? `Aprobado con ${ex.best} %` : ready ? 'Disponible: 24 preguntas, aprueba con 75 %' : 'Se activa al completar las 8 unidades'}</small></span>${ready && !ex.passedAt && unlocked ? `<button class="btn small" data-a="examStart" data-l="${L}">Empezar</button>` : `<span class="chip ${ex.passedAt ? 'c-done' : 'c-pend'}">${ex.passedAt ? 'Aprobado' : 'Cerrado'}</span>`}</div>`;
    return `<section class="lvsec"><div class="lvhead"><h2>${L} <span class="muted">· ${LEVEL_INFO[L].name}</span></h2><span class="mono small">${unlocked ? Math.round(prog.byLevel[L] * 100) + ' %' : 'bloqueado'} · ~${LEVEL_INFO[L].words.toLocaleString('es-MX')} palabras</span></div><div class="ulist">${rows}${exRow}</div></section>`;
  }).join('');
  return pageHead('Temario') + `<p class="lede">El mapa completo de A1 a B2. Avanzas unidad por unidad; cada nivel se desbloquea al aprobar el examen del anterior.</p>` + sections;
}

  } else {

      ${seenV.length ? `<h2 class="sec">Vocabulario presentado <span class="muted">(${seenV.length})</span></h2><p class="muted small">Referencia. Para memorizar, la práctica de recuperación de las sesiones funciona mejor que releer esta lista.</p><div class="vlist">${seenV.map(v => `<div class="vrow"><button class="icon-btn small" data-a="say" data-t="${esc(alts(v.pt)[0])}" aria-label="Escuchar">${I.play}</button><span class="pt">${esc(v.pt)}</span><span class="muted">${esc(v.es)}</span></div>`).join('')}</div>` : ''}`;
  }
  return pageHead(`${c.level} · Unidad ${c.n}`, 'map') + `<h2 class="utitle">${esc(c.title)}</h2><p class="lede">${esc(c.desc)}</p>` + body;

function gTable(rows) { return `<div class="tbl-wrap"><table class="gtbl"><thead><tr><th>Portugués</th><th>Español</th></tr></thead><tbody>${rows.map(r => `<tr><td class="pt">${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`; }

/* ---------- Progreso ---------- */
function vStats() {
  const sa = srsAll(), T = todayIdx(), vs = vocabStats(C, sa), fc = forecast(C, sa, T, 7);
  let ans30 = 0, ok30 = 0;
  for (let d = T - 29; d <= T; d++) { const r = ST.days[dayKey(d)]; if (r) { ans30 += r.ans; ok30 += r.ok; } }
  const week = []; for (let d = T - 6; d <= T; d++) { const r = ST.days[dayKey(d)] || {}; week.push({ d, min: Math.round((r.ms || 0) / 60000), ans: r.ans || 0 }); }
  const wmax = Math.max(GOAL_MIN * 1.25, ...week.map(w => w.min));
  const wd = d => new Date(d * DAY_MS + 43200000).toLocaleDateString('es-MX', { weekday: 'short', timeZone: 'UTC' }).replace('.', '');
  const weeks = []; for (let w = 7; w >= 0; w--) { let m = 0; for (let d = T - w * 7 - 6; d <= T - w * 7; d++) { const r = ST.days[dayKey(d)]; if (r) m += r.ms || 0; } weeks.push(Math.round(m / 60000)); }
  const wkmax = Math.max(60, ...weeks);
  const types = Object.keys(TYPE_LABEL).filter(k => ST.byType[k] && ST.byType[k].n);
  const fmax = Math.max(1, ...fc);
  return pageHead('Progreso') + `
    <div class="tiles four">
      <div class="tile"><span class="tile-num">${vs.seen}</span><span class="tile-lbl">palabras vistas</span></div>
      <div class="tile"><span class="tile-num">${vs.learned}</span><span class="tile-lbl">aprendidas<br><small>estables 7+ días</small></span></div>
      <div class="tile"><span class="tile-num">${vs.mature}</span><span class="tile-lbl">consolidadas<br><small>21+ días</small></span></div>
      <div class="tile"><span class="tile-num">${ans30 ? Math.round(ok30 / ans30 * 100) + '<small>%</small>' : '–'}</span><span class="tile-lbl">aciertos<br><small>últimos 30 días</small></span></div>
    </div>
    <section class="panel"><div class="row between"><h2 class="sec0">Esta semana</h2><span class="mono small">meta ${GOAL_MIN} min/día</span></div>
      <div class="bars" role="img" aria-label="Minutos por día de los últimos 7 días">
        <span class="goal" style="bottom:calc(22px + (100% - 22px) * ${(GOAL_MIN / wmax).toFixed(3)})"></span>
        ${week.map(w => `<div class="barcol"><span class="bv mono">${w.min || ''}</span><span class="b ${w.min >= GOAL_MIN ? 'hit' : ''}" style="height:${w.min / wmax * 100}%"></span><span class="bl">${esc(wd(w.d))}</span></div>`).join('')}
      </div>
      <p class="muted small">${week.reduce((a, w) => a + w.ans, 0)} respuestas en 7 días · racha máxima: ${ST.streak.best || 0} días</p></section>
    <section class="panel"><h2 class="sec0">Precisión por tipo de ejercicio</h2>
      ${types.length ? `<div class="accl">${types.map(k => { const b = ST.byType[k], p = Math.round(b.ok / b.n * 100); return `<div class="accrow"><span>${TYPE_LABEL[k]}</span><span class="accbar"><i style="width:${p}%" class="${p >= 85 ? 'hi' : p >= 65 ? 'mid' : 'lo'}"></i></span><span class="mono small">${p}% · ${b.n}</span></div>`; }).join('')}</div>` : '<p class="muted">Aún no hay respuestas. Aparecerán al terminar tu primera sesión.</p>'}
    </section>
    <section class="panel"><h2 class="sec0">Repasos de los próximos 7 días</h2>
      <div class="fc">${fc.map((n, i) => `<div class="fccol"><span class="fcb" style="height:${n / fmax * 100}%"></span><span class="mono small">${n}</span><span class="bl">${i === 0 ? 'hoy' : esc(wd(T + i))}</span></div>`).join('')}</div></section>
    <section class="panel"><h2 class="sec0">Últimas 8 semanas</h2>
      <div class="wk">${weeks.map((m, i) => `<div class="wkcol"><span class="wkb" style="height:${m / wkmax * 100}%"></span><span class="mono small">${m}</span><span class="bl">${i === 7 ? 'esta' : '−' + (7 - i)}</span></div>`).join('')}</div>
      <p class="muted small">Minutos de práctica por semana.</p></section>`;
}

/* ---------- Respaldo ---------- */
function buildBackup() {
  const units = {}, profiles = [];
  for (const k in Store.docs) if (k.startsWith('unit.')) units[k.slice(5)] = Store.docs[k].unit;
  for (const p of Profiles.list()) {
    const st = p.id === Profiles.activeId() ? ST : Store.get(P('state', p.id));
    profiles.push({ id: p.id, name: p.name, color: p.color || 0, state: st || null, srs: srsAll(p.id) });
  }
  return { format: 'ptbr-backup', version: 2, app: 'Ponte Português', exportedAt: new Date().toISOString(), active: Profiles.activeId(), profiles, units };
}
function restoreInto(id, state, srs) {
  srs = srs || {}; const pre = P('srs.', id);
  for (const k of Object.keys(Store.docs)) if (k.startsWith(pre) && !srs[k.slice(pre.length)]) Store.del(k);
  for (const u in srs) Store.put(pre + u, { cards: srs[u] || {} });
  if (state) { const s2 = migrate(clone(state)); s2.session = null; Store.put(P('state', id), s2); } else Store.del(P('state', id));
}
function vBackup() {
  const b = ui.backup, r = b.report;

/* ---------- práctica ---------- */
function curTask() { if (ui.mode === 'session') return ST.session && ST.session.tasks[ST.session.i]; if (ui.mode === 'test') return ui.test.tasks[ui.test.i]; return null; }
function pmode() { const m = ui.mode === 'session' ? ST.session.mode : ui.test.mode; return { speak: !!m.speak, audio: !!m.audio && Speech.ok, sr: !!m.speak && SR.available(), test: ui.mode === 'test' }; }

function vPractice() {
  let guard = 0;

    const task = curTask();
    if (!task) { if (ui.mode === 'session') { finishSession(); } else finishTest(); return null; }
    const key = (ui.mode === 'session' ? ST.session.i : ui.test.i) + ':' + JSON.stringify(task);
    if (!EX || EX.key !== key) EX = makeEx(task, key);
    if (!EX.skip) break;
    if (ui.mode === 'session') ST.session.i++; else ui.test.i++;
    EX = null;
  }
  const S = ui.mode === 'session' ? ST.session : ui.test;
  const pct = Math.round(S.i / Math.max(1, S.tasks.length) * 100);
  const tag = ui.mode === 'session' ? (PHASES[EX.task.ph] || '') : (ui.test.kind === 'unit' ? 'Mini evaluación' : 'Examen ' + ui.test.ref);
  const content = vEx();
  const hasSheet = EX.phase === 'fb' && EX.task.k === 'card';
  return `<div class="prac"><header class="ptop"><button class="icon-btn" data-a="pause" aria-label="${ui.mode === 'session' ? 'Pausar sesión' : 'Salir de la evaluación'}">${I.x}</button><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><span class="ptag">${esc(tag)}</span></header>
    <main class="pmain ${hasSheet ? 'has-sheet' : ''}">${content}</main>${hasSheet ? vSheet() : ''}</div>`;
}
function makeEx(task, key) {
  const M = pmode(), ex = { task, key, phase: 'ask', t: task.t, start: Date.now(), M };
  const ref = C.items[task.id];
  if (task.k !== 'phase' && !ref) { ex.skip = true; return ex; }
  switch (task.k) {
    case 'card': ex.ref = ref; ex.item = ref.it; prepCard(ex, M); break;
    case 'intro': ex.item = ref.it; if (M.audio) setTimeout(() => Speech.say(alts(ref.it.pt)[0]), 60); break;
    case 'note': ex.item = ref.it; ex.ans = null; break;
    case 'dlg': ex.item = ref.it; ex.stage = M.audio ? 'listen' : 'read'; ex.qi = 0; ex.ans = null; ex.open = {}; ex.playing = -1; ex.plays = 0; break;
    case 'shadow': ex.item = ref.it; ex.line = ref.it.lines[task.line]; if (!ex.line) { ex.skip = true; break; } ex.stage = 'ask'; ex.showEs = false; break;
    case 'prod': ex.item = ref.it; ex.text = ''; ex.stage = 'ask'; break;
  }

}
function distractors(v, n) {
  const ref = C.items[v.id], u = C.units[ref.unit];
  let pool = u.vocab.filter(x => x.id !== v.id).map(x => x.es);
  if (pool.length < 10) for (const id of C.order) if (id !== ref.unit) pool.push(...C.units[id].vocab.map(x => x.es));
  const bad = new Set(alts(v.es).map(fold)); bad.add(fold(v.es));
  pool = [...new Set(pool)].filter(x => !alts(x).some(a => bad.has(fold(a))) && !bad.has(fold(x)));
  const wc = s => s.split(/\s+/).length, tw = wc(v.es);
  pool = shuffle(pool).sort((a, b) => Math.abs(wc(a) - tw) - Math.abs(wc(b) - tw)).slice(0, 8);
  const out = []; if (v.kind === 'falso' && v.trap) out.push(v.trap);
  for (const x of shuffle(pool)) { if (out.length >= n) break; if (!out.includes(x)) out.push(x); }

function prepCard(ex, M) {

  if (t === 'pron-sr' && !M.sr) t = pronVariant(item, Object.assign({}, M, { sr: false }));
  if ((t === 'pron-pair' || t === 'pron-listen') && !M.audio) t = item.quiz ? 'pron-quiz' : null;
  if (t === 'pron-self' && M.test) t = item.quiz ? 'pron-quiz' : null;
  if (ref.kind === 'v' && t === 'completar' && !vocabCan('completar', item)) t = 'escribir';

    else if (t === 'ordenar') { setupOrder(ex, v.ex); ex.es = v.exEs; }
    else if (t === 'dictado') { ex.text = v.ex; ex.answers = [v.ex]; ex.sentence = true; setTimeout(() => Speech.say(v.ex), 60); }
    else if (t === 'traducir') { ex.prompt = v.exEs; ex.answers = [v.ex]; ex.sentence = true; ex.dir = 'es-pt'; }
  } else {
    const e = item;
    switch (t) {

      case 'elegir': ex.opts = shuffle(e.options.map((o, i) => ({ txt: o, ok: i === e.answer }))); break;
      case 'traducir':

      case 'dictado': ex.text = e.pt; ex.answers = [e.pt]; ex.sentence = true; setTimeout(() => Speech.say(e.pt), 60); break;
      case 'pron-pair': ex.target = Math.random() < 0.5 ? 0 : 1; ex.opts = e.pair.map((w, i) => ({ txt: w, ok: i === ex.target })); setTimeout(() => Speech.say(e.pair[ex.target]), 60); break;
      case 'pron-quiz': ex.opts = shuffle(e.quiz.options.map((o, i) => ({ txt: o, ok: i === e.quiz.answer }))); break;

    }
  }
}

  sCover() { EX.covered = true; render(); },
  smic() {
    const ex = EX; if (ex.listening) { SR.stop(); return; }
    ex.listening = true; render();
    SR.listen({
      onResult(a) { const m = srMatch(a, ex.line.pt); ex.listening = false; ex.heard = m.heard; ex.score = m.score; ex.correct = m.score >= 0.75; ex.stage = 'result'; record('shadowing', ex.correct); render(); },
      onError() { ex.listening = false; if (SR.state === 'off') { toast('Reconocimiento de voz no disponible: califícate tú.'); ex.M.sr = false; } render(); },
      onEnd() { if (ex.listening) { ex.listening = false; if (EX === ex) render(); } }
    });
  },
  sself(el) {
    const v = +el.dataset.v;
    if (v === 0) { if (EX.M.audio) Speech.say(EX.line.pt, { slow: true }); toast('Escúchala otra vez y repite.'); return; }
    record('shadowing', v === 2); EX.correct = v === 2; advance();
  },
  shDone() { advance(); },
  pmic() {
    const ex = EX; if (ex.listening) { SR.stop(); return; }
    const ta = document.getElementById('prodtext'); if (ta) ex.text = ta.value;
    ex.listening = true; render();
    SR.listen({
      onResult(a) { ex.listening = false; ex.text = (ex.text ? ex.text + ' ' : '') + (a[0] || ''); render(); },
      onError() { ex.listening = false; if (SR.state === 'off') { toast('Reconocimiento de voz no disponible: escribe o di tu frase en voz alta.'); ex.M.sr = false; } render(); },
      onEnd() { if (ex.listening) { ex.listening = false; if (EX === ex) render(); } }
    });
  },
  pModel() {
    const ta = document.getElementById('prodtext'); if (ta) EX.text = ta.value.trim();
    if (!EX.M.speak && !EX.text) { toast('Escribe al menos una frase antes de ver el modelo.'); return; }
    EX.stage = 'result'; render();
  },
  pself(el) {
    const v = +el.dataset.v, ex = EX, id = ex.task.id;
    record('produccion', v >= 1);
    const r = ST.prod[id] || {}; ST.prod[id] = { n: (r.n || 0) + 1, last: todayIdx() };
    if (ex.text) { ST.prodLog.unshift({ d: todayIdx(), id, text: ex.text.slice(0, 400), self: v }); ST.prodLog = ST.prodLog.slice(0, 60); }
    advance();
  },
  focus(el) { ST.focusUnit = el.dataset.id; saveState(); toast('Tus próximas palabras nuevas vendrán de ' + unitLabel(el.dataset.id) + '.'); render(); },
  placeStart() { go('placement', { place: { stage: 'intro', i: 0, answers: [] } }); },
  placeSkip() { ST.placementSkip = true; saveState(); render(); },
  placeGo() { ui.place.stage = 'q'; render(); },
  placePick(el) { const p = ui.place; p.answers[p.i] = +el.dataset.i; p.i++; if (p.i >= PLACEMENT.length) { p.result = placementResult(p.answers); p.stage = 'result'; } render(); },
  placeApply() {
    const r = ui.place.result; ST.placement = { doneAt: Date.now(), start: r.start, byL: r.byL };
    if (LEVELS.indexOf(r.start) > LEVELS.indexOf(ST.unlockedLevel)) ST.unlockedLevel = r.start;
    const first = CURRICULUM.find(c => c.level === r.start && C.units[c.id]); if (first) ST.focusUnit = first.id;
    saveState(); toast('Desbloqueado hasta ' + r.start + '.'); go('home');
  },
  placeKeep() { const r = ui.place.result; ST.placement = { doneAt: Date.now(), start: r.start, byL: r.byL }; saveState(); go('home'); },
  packCheck() { const ta = document.getElementById('pack-text'); ui.add.text = ta ? ta.value : ui.add.text; ui.add.report = packReport(ui.add.text); render(); },
  packImport() {
    const r = ui.add.report; if (!r || r.errors.length || !ui.ready) return;
    const done = [];
    for (const u of r.units) {
      const h = hashStr(JSON.stringify(u)), prev = Store.get('unit.' + u.id);
      if (prev && prev.hash === h) { done.push(unitLabel(u.id) + ' (sin cambios)'); continue; }
      Store.put('unit.' + u.id, { unit: u, packId: r.packId, importedAt: Date.now(), hash: h });
      done.push(unitLabel(u.id));
    }
    rebuildContent(); ui.add = { text: '', report: null };
    toast('Importado: ' + done.join(', ')); render();
  },
  copySpec() { copyText(PACK_SPEC, 'Especificación copiada'); },
  pickProfile(el) { switchProfile(el.dataset.id); go('home'); toast('Perfil: ' + Profiles.active().name); },
  profEdit(el) { const p = Profiles.list().find(x => x.id === el.dataset.id); if (!p) return; Object.assign(ui.prof, { edit: p.id, editName: p.name, editColor: p.color || 0, del: null }); render(); },
  profEditNo() { ui.prof.edit = null; render(); },
  profDel(el) { ui.prof.del = el.dataset.id; ui.prof.edit = null; render(); },
  profDelNo() { ui.prof.del = null; render(); },
  profDelGo(el) { const p = Profiles.list().find(x => x.id === el.dataset.id); deleteProfile(el.dataset.id); ui.prof.del = null; toast('Perfil «' + (p ? p.name : '') + '» borrado'); render(); },
  pickColor(el) { setPath(el.dataset.bind, +el.dataset.c); render(); },
  copyAsk() { copyText(nextAsk(), 'Pedido copiado: pégalo en otro chat'); },
  backupCopy() { copyText(JSON.stringify(buildBackup()), 'Respaldo copiado'); },
  backupShow() { ui.backup.out = JSON.stringify(buildBackup()); render(); const el = document.getElementById('backup-out'); if (el) el.select(); },
  async backupDownload() {
    const name = 'ponte-respaldo-' + dayKey(todayIdx()) + '.json', data = JSON.stringify(buildBackup(), null, 1);
    if (Caps.downloads) {
      try { await Caps.downloads.save({ filename: name, data }); toast('Respaldo guardado'); }
      catch (e) { if (e && e.code === 'declined') return; toast('No se pudo descargar. Usa «Copiar al portapapeles».'); }
      return;
    }
    if (IN_ARTIFACT) return;
    const blob = new Blob([data], { type: 'application/json' });
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Respaldo de Ponte' }); toast('Respaldo listo'); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Respaldo descargado');
    } catch (e) { toast('No se pudo descargar. Usa «Copiar al portapapeles».'); }
  },
  backupCheck() { const ta = document.getElementById('backup-text'); ui.backup.text = ta ? ta.value : ui.backup.text; ui.backup.report = backupReport(ui.backup.text); ui.backup.confirm = false; render(); },
  restoreAsk() { ui.backup.confirm = true; render(); },
  restoreNo() { ui.backup.confirm = false; render(); },
  restoreGo() {
    const r = ui.backup.report; if (!r || !r.obj) return; const o = r.obj;
    if (o.version === 1) restoreInto(Profiles.activeId(), o.state, o.srs);
    else {
      const keep = new Set(o.profiles.map(p => p.id));
      for (const p of Profiles.list()) if (!keep.has(p.id)) purgeProfileDocs(p.id);
      Profiles.save(o.profiles.map(p => ({ id: p.id, name: String(p.name).slice(0, 24), color: (+p.color || 0) % 4 })), keep.has(o.active) ? o.active : o.profiles[0].id);
      for (const p of o.profiles) restoreInto(p.id, p.state, p.srs);
    }
    for (const id in (o.units || {})) Store.put('unit.' + id, { unit: o.units[id], packId: 'respaldo', importedAt: Date.now(), hash: hashStr(JSON.stringify(o.units[id])) });
    rebuildContent(); loadProfile();
    ui.backup = { text: '', report: null, confirm: false, out: '' }; toast('Respaldo restaurado'); go('home');
  },
  newPer(el) { ST.settings.newPer = clamp(ST.settings.newPer + (+el.dataset.d), 5, 10); saveState(); render(); },
  set(el) { const k = el.dataset.k; let v = el.dataset.v; if (k === 'slowRate') v = +v; ST.settings[k] = v; saveState(); if (k === 'theme') applyTheme(); render(); },
  srTest() {
    ST.srBlocked = false; SR.detect(); render();
    if (!SR.available()) { toast(SR.reason); return; }
    toast('Di «bom dia»…');
    SR.listen({ onResult(a) { toast('Entendí: «' + (a[0] || '') + '». Funciona.'); render(); }, onError(e) { toast(SR.state === 'off' ? SR.reason : 'No te escuché (' + e + '). Intenta otra vez.'); render(); } });
  },
  resetAsk() { ui.confirmReset = true; render(); },
  resetNo() { ui.confirmReset = false; render(); },
  resetGo() {
    const keepTheme = ST.settings;
    ST = freshState(); ST.settings = keepTheme;
    for (const k of Object.keys(Store.docs)) if (k.startsWith(P('srs.'))) Store.put(k, { cards: {} });
    saveState(); ui.confirmReset = false; toast('Progreso borrado'); go('home');
  }
};
const F = {
  type() { const inp = document.getElementById('ans'); if (!inp || !EX || EX.phase !== 'ask') return; const v = inp.value; if (!v.trim()) { inp.focus(); return; } checkTyped(v); },
  shType() {
    const inp = document.getElementById('ans'); const v = inp ? inp.value : ''; if (!v.trim()) return;
    const r = grade(v, [EX.line.pt], { sentence: true }); EX.input = v; EX.correct = isCorrect(r.lvl); EX.stage = 'result'; record('shadowing', EX.correct); render();
  },
  profAdd() {
    const name = String(ui.prof.newName || '').trim().slice(0, 24); if (!name) { toast('Escribe un nombre para el perfil.'); return; }
    const list = Profiles.list().slice(); if (list.length >= MAX_PROFILES) return;
    list.push({ id: 'p' + Date.now().toString(36), name, color: (+ui.prof.newColor || 0) % 4 });
    Profiles.save(list); ui.prof.newName = ''; ui.prof.newColor = list.length % 4;
    toast('Perfil «' + name + '» creado'); render();
  },
  profRename(f) {
    const id = f.dataset.id, name = String(ui.prof.editName || '').trim().slice(0, 24); if (!name) return;
    Profiles.save(Profiles.list().map(p => p.id === id ? Object.assign({}, p, { name, color: (+ui.prof.editColor || 0) % 4 }) : p));
    ui.prof.edit = null; render();
  },
  inputAdd() {
    const f = ui.inputForm, min = parseInt(f.min, 10);
    if (!f.title.trim() || !(min > 0)) { toast('Escribe un título y los minutos.'); return; }
    ST.inputLog.unshift({ d: todayIdx(), type: f.type, title: f.title.trim().slice(0, 120), min: Math.min(600, min), note: (f.note || '').trim().slice(0, 200) });
    ST.inputLog = ST.inputLog.slice(0, 200); saveState();
    ui.inputForm = { type: f.type, title: '', min: '', note: '' }; toast('Registrado'); render();
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('submit', e => { const f = e.target; if (f.dataset && f.dataset.f) { e.preventDefault(); const fn = F[f.dataset.f]; if (fn) fn(f); } });
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('.acc')) e.preventDefault(); Activity.ping(); }, true);
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.bind) setPath(t.dataset.bind, t.value); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.bind) setPath(t.dataset.bind, t.value);
  if (t.dataset && t.dataset.set) { ST.settings[t.dataset.set] = t.value; saveState(); }
  if (t.dataset && t.dataset.file && t.files && t.files[0]) {
    const which = t.dataset.file, rd = new FileReader();
    rd.onload = () => { const txt = String(rd.result || ''); if (which === 'pack') { ui.add.text = txt; ui.add.report = packReport(txt); } else { ui.backup.text = txt; ui.backup.report = backupReport(txt); } render(); };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => {
  Activity.ping();
  if (ui.view !== 'practice' || !EX) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (EX.phase === 'fb' && EX.task.k === 'card' && ui.mode === 'session' && /^[1-4]$/.test(e.key) && !(EX.auto && !EX.showRates)) { e.preventDefault(); rate(+e.key); return; }
  if (EX.phase === 'ask' && EX.opts && /^[1-5]$/.test(e.key)) { const b = app.querySelector(`.opt[data-i="${+e.key - 1}"]`); if (b) { e.preventDefault(); b.click(); } }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && ST) { saveState(); Store.flush(); } });

/* ---------- arranque ---------- */
async function boot() {
  Store.loadLocal();
  rebuildContent(); loadProfile(); Speech.init();
  render();
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { Caps.downloads = d; if (ui.view === 'backup') render(); }).catch(() => { });
  await Store.connect();
  if (!IN_ARTIFACT) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js'); } catch (e) { }
  }
  rebuildContent(); ui.ready = true; loadProfile();
  if (Profiles.list().length > 1 && ui.view === 'home') ui.view = 'who';
  if (ui.view !== 'practice') render();
}
boot();

</script>
